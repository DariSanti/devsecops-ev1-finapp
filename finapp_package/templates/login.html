{% extends "base.html" %}
{% block title %}Iniciar sesión - FinApp{% endblock %}
{% block content %}
<h1>Iniciar sesión</h1>
<form method="POST" autocomplete="off">
  <label for="username">Usuario</label>
  <input type="text" id="username" name="username" required maxlength="40">

  <label for="password">Contraseña</label>
  <input type="password" id="password" name="password" required maxlength="80">

  <button type="submit">Ingresar</button>
</form>

<a class="button-link" href="{{ url_for('register') }}">Crear una cuenta nueva</a>
{% endblock %}
